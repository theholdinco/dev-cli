{% extends "base.html" %}

{% block title %}New Session - dev-cli{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('sessions.list_sessions_view') }}" class="text-gray-400 hover:text-gray-300 text-sm">&larr; Back to sessions</a>
</div>

<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">New Session</h1>

    <form method="POST" action="{{ url_for('sessions.create_session') }}" class="space-y-5">
        <div>
            <label for="project" class="block text-sm font-medium text-gray-300 mb-1">Project</label>
            <select name="project" id="project" required
                    class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="" disabled selected>Select a project...</option>
                {% for project in projects %}
                    <option value="{{ project }}">{{ project }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="branch" class="block text-sm font-medium text-gray-300 mb-1">Branch Name</label>
            <input type="text" name="branch" id="branch" required placeholder="feat/my-feature"
                   class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500 font-mono">
        </div>

        <div>
            <label for="agent_type" class="block text-sm font-medium text-gray-300 mb-1">Agent Type</label>
            <select name="agent_type" id="agent_type"
                    class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="claude">Claude</option>
                <option value="codex">Codex</option>
                <option value="none">None (manual)</option>
            </select>
        </div>

        <div class="flex items-center space-x-2">
            <input type="checkbox" name="yolo" id="yolo"
                   class="rounded bg-gray-800 border-gray-600 text-blue-600 focus:ring-blue-500">
            <label for="yolo" class="text-sm text-gray-300">YOLO mode (skip permissions)</label>
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-md transition-colors text-sm">
                Create Session
            </button>
        </div>
    </form>
</div>
{% endblock %}
