{% extends "base.html" %}

{% block title %}Add Task - dev-cli{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('tasks.list_tasks_view') }}" class="text-gray-400 hover:text-gray-300 text-sm">&larr; Back to tasks</a>
</div>

<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-white mb-6">Add Task</h1>

    <form method="POST" action="{{ url_for('tasks.create_task') }}" class="space-y-5">
        <div>
            <label for="project" class="block text-sm font-medium text-gray-300 mb-1">Project</label>
            <select name="project" id="project" required
                    class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="" disabled selected>Select a project...</option>
                {% for project in projects %}
                    <option value="{{ project }}">{{ project }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="branch" class="block text-sm font-medium text-gray-300 mb-1">Branch Name</label>
            <input type="text" name="branch" id="branch" required placeholder="feat/my-feature"
                   class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500 font-mono">
        </div>

        <div>
            <label for="from_branch" class="block text-sm font-medium text-gray-300 mb-1">Base Branch <span class="text-gray-500">(optional)</span></label>
            <input type="text" name="from_branch" id="from_branch" placeholder="main"
                   class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500 font-mono">
            <p class="mt-1 text-xs text-gray-500">Leave empty to use the default branch. Use this to base the worktree off a specific branch.</p>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-300 mb-1">Task Description</label>
            <textarea name="description" id="description" required rows="4"
                      placeholder="Describe what Claude should implement..."
                      class="w-full bg-gray-800 border border-gray-600 text-gray-200 rounded-md px-3 py-2 text-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <div class="pt-2">
            <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-md transition-colors text-sm">
                Add Task
            </button>
        </div>
    </form>
</div>
{% endblock %}
